<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1128">
  <title>Deportes Hoy - Horario Argentina</title>
  <meta name="description" content="Todos los partidos y resultados del día con horario de Argentina: fútbol argentino, copas, Europa, NBA y Los Pumas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
  <style>
/* Tema oscuro azul noche con celeste y dorado (colores de la bandera), pensado para que no sea apagado */
:root {
  color-scheme: dark;
  --bg: #0a1128;
  --bg-glow: #1b3a7a;
  --card: #131e42;
  --card-2: #1a2756;
  --border: #26377a;
  --text: #eef3ff;
  --muted: #93a5d6;
  --celeste: #75aadb;
  --gold: #f6b40e;
  --live: #ff5d73;
  --good: #4ade80;
  --radius: 14px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 420px at 50% -80px, color-mix(in srgb, var(--bg-glow) 70%, transparent), transparent),
    var(--bg);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}

img { max-width: 100%; }

/* ---------- Header ---------- */
.header { background: linear-gradient(180deg, #16296a 0%, #0f1c4d 100%); }
.header__stripe {
  height: 5px;
  background: linear-gradient(90deg, var(--celeste) 0 33.3%, #fff 33.3% 66.6%, var(--celeste) 66.6% 100%);
}
.header__inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand__logo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  padding: 5px 12px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}
.brand__img { height: 24px; width: auto; object-fit: contain; }
.clock { font-size: 12.5px; font-weight: 600; color: var(--celeste); text-align: right; white-space: nowrap; }

/* ---------- Filtros con banderita ---------- */
.filters {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px 7px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .15s, background .15s, border-color .15s;
}
.filter:hover { border-color: var(--celeste); transform: translateY(-1px); }
.filter img { width: 22px; height: 15px; object-fit: cover; border-radius: 3px; }
.filter__all { font-size: 14px; line-height: 1; }
.filter.is-active {
  background: linear-gradient(135deg, var(--celeste), #a9ccee);
  border-color: transparent;
  color: #0a1128;
  box-shadow: 0 6px 16px rgba(117, 170, 219, .35);
}

/* ---------- Layout ---------- */
.container { max-width: 860px; margin: 0 auto; padding: 18px 14px 56px; }

/* ---------- Selector de día ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days[hidden] { display: none; }
.day {
  flex: 0 0 auto;
  min-width: 78px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  text-align: center;
  line-height: 1.2;
  cursor: pointer;
}
.day small { display: block; font-size: 11px; color: var(--muted); }
.day strong { font-size: 13px; }
.day.is-active { background: var(--gold); border-color: var(--gold); color: #1c1500; }
.day.is-active small { color: rgba(28, 21, 0, .7); }

/* ---------- Stats / chips ---------- */
.stats { display: flex; justify-content: center; gap: 24px; text-align: center; margin: 4px 0 16px; }
.stat strong { display: block; font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 30px; line-height: 1.05; }
.stat span { font-size: 12px; color: var(--muted); }
.stat--live strong { color: var(--live); }
.stat--done strong { color: var(--muted); }

.chips { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.chip {
  padding: 5px 13px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.chip.is-active { background: var(--card-2); border-color: var(--celeste); color: var(--text); }

/* ---------- Aviso ---------- */
.warning {
  background: rgba(246, 180, 14, .12);
  border: 1px solid rgba(246, 180, 14, .5);
  color: #fcd34d;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.5px;
  margin-bottom: 14px;
}
.warning[hidden] { display: none; }

/* ---------- Grupos y partidos ---------- */
.group { margin-bottom: 22px; }
.group__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 9px;
  font-family: "Barlow Condensed", system-ui, sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--c, var(--celeste));
}
.group__count { font-size: 13px; font-weight: 600; color: var(--muted); }
.flag { width: 22px; height: 15px; object-fit: cover; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .18); }
.group__note {
  margin: 0 0 8px;
  padding: 9px 12px;
  font-size: 13px;
  color: var(--muted);
  background: rgba(19, 30, 66, .6);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.event {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 10px;
  align-items: center;
  padding: 11px 12px;
  margin-bottom: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color .2s, transform .2s;
}
.event:hover { border-color: var(--celeste); }
.event.is-live {
  border-color: var(--live);
  background: linear-gradient(90deg, rgba(255, 93, 115, .14), var(--card) 60%);
  box-shadow: 0 0 0 1px rgba(255, 93, 115, .25), 0 8px 24px rgba(255, 93, 115, .12);
}

.event__when { text-align: center; line-height: 1.1; }
.event__time { font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 21px; font-weight: 700; }
.event__date { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--gold); }
.event.is-live .event__time { color: var(--live); }

.event__match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; min-width: 0; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 600; }
.team--away { justify-content: flex-end; text-align: right; }
.team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team img { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
.team.is-winner span { font-weight: 800; color: #fff; }

.score { min-width: 80px; text-align: center; }
.score__nums { font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .03em; }
.event.is-live .score__nums { color: var(--live); }
.score__vs { font-size: 12px; color: var(--muted); }
.score__detail { display: block; margin-top: 1px; font-size: 11px; color: var(--muted); }
.event.is-live .score__detail { color: var(--live); font-weight: 700; }
.event__venue { grid-column: 2; margin-top: -4px; font-size: 11px; color: var(--muted); }

/* ---------- Resultados anteriores ---------- */
.results { margin-top: 34px; }
.results[hidden] { display: none; }
.results__block {
  margin-bottom: 14px;
  padding: 4px 12px 8px;
  background: rgba(19, 30, 66, .55);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.results__block summary { padding: 10px 0; cursor: pointer; font-size: 15px; list-style-position: inside; }
.results__block summary strong { color: var(--gold); font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.results__sub { color: var(--muted); font-size: 12.5px; }
.results__block[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 12px; }

/* ---------- Estados ---------- */
.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.empty strong { display: block; margin-bottom: 4px; color: var(--text); }

.skeleton {
  height: 64px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .filter, .event { transition: none; } }

.footer { margin-top: 30px; text-align: center; font-size: 11.5px; color: var(--muted); }
.footer p { margin: 4px 0; }
.diag { margin-top: 10px; text-align: left; }
.diag summary { cursor: pointer; text-align: center; }
.diag ul { margin: 8px 0 0; padding-left: 18px; }
.diag li.bad { color: #fca5a5; }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (min-width: 1024px) {
  .brand__img { height: 34px; }
  .clock { font-size: 14px; }
}
@media (max-width: 480px) {
  .event { grid-template-columns: 50px 1fr; padding: 10px; }
  .team { font-size: 13px; }
  .team img { width: 22px; height: 22px; }
  .score { min-width: 66px; }
  .score__nums { font-size: 23px; }
}

</style>
</head>

      <div class="stats" id="stats">
        <div class="stat"><strong id="statTotal">0</strong><span>Total</span></div>
        <div class="stat stat--live"><strong id="statLive">0</strong><span>En vivo</span></div>
        <div class="stat"><strong id="statUpcoming">0</strong><span>Próximos</span></div>
        <div class="stat stat--done"><strong id="statFinished">0</strong><span>Finalizados</span></div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Estado">
        <button class="chip is-active" data-status="all">Todos</button>
        <button class="chip" data-status="live">En vivo</button>
        <button class="chip" data-status="upcoming">Próximos</button>
        <button class="chip" data-status="finished">Finalizados</button>
      </div>

      <div id="warning" class="warning" hidden></div>
      <div id="content" aria-live="polite"></div>

      <section id="results" class="results"></section>

      <footer class="footer">
        <p>Datos de ESPN · Se actualiza solo (cada 30 s en vivo, 60 s el resto) · Horarios de Argentina (UTC-3)</p>
        <p id="updatedAt"></p>
        <details class="diag"><summary>Detalle de fuentes</summary><ul id="diagList"></ul></details>
      </footer>
    </div>
  </main>

  <script>
/* Deportes Hoy - Horario Argentina
 * Datos: API pública de ESPN (se consulta directo desde el navegador).
 * Todo el manejo de fechas se hace en hora de Argentina (America/Argentina/Buenos_Aires).
 */
(function () {
  "use strict";

  var TZ = "America/Argentina/Buenos_Aires";
  var ESPN = "https://site.api.espn.com/apis/site/v2/sports/";

  // ---------------------------------------------------------------------------
  // Competencias. Cada una puede tener varias fuentes (si una falla, usa las otras).
  // ---------------------------------------------------------------------------
  var COMPETITIONS = [
    { id: "argentina", flag: "ar", tab: "Liga Argentina", label: "Liga Profesional", color: "#75aadb", sources: ["soccer/arg.1", "soccer/arg.copa_lpf"] },
    { id: "copa-argentina", flag: "ar", tab: "Copa Argentina", label: "Copa Argentina", color: "#f6b40e", sources: ["soccer/arg.copa"] },
    { id: "libertadores", flag: "globe", tab: "Libertadores", label: "Copa Libertadores", color: "#fbbf24", sources: ["soccer/conmebol.libertadores"] },
    { id: "sudamericana", flag: "globe", tab: "Sudamericana", label: "Copa Sudamericana", color: "#34d399", sources: ["soccer/conmebol.sudamericana"] },
    { id: "champions", flag: "eu", tab: "Champions", label: "UEFA Champions League", color: "#818cf8", sources: ["soccer/uefa.champions"] },
    { id: "premier", flag: "gb-eng", tab: "Premier", label: "Premier League", color: "#c084fc", sources: ["soccer/eng.1"] },
    { id: "laliga", flag: "es", tab: "La Liga", label: "La Liga", color: "#fb923c", sources: ["soccer/esp.1"] },
    { id: "seriea", flag: "it", tab: "Serie A", label: "Serie A", color: "#4ade80", sources: ["soccer/ita.1"] },
    { id: "nba", flag: "us", tab: "NBA", label: "NBA", color: "#fb7185", sources: ["basketball/nba"] },
    {
      id: "pumas", flag: "ar", rugby: true, tab: "Pumas", label: "Los Pumas", color: "#22d3ee", teamFilter: /argentina|pumas/i,
      // Rugby en ESPN: 17567 = Nations Championship 2026, 289234 = test matches, 244293 = Rugby Championship.
      // Se filtra solo lo de Argentina.
      sources: ["rugby/17567", "rugby/289234", "rugby/244293"]
    }
  ];
  var TABS = ["Todos"].concat(COMPETITIONS.map(function (c) { return c.tab; }));

  // ---------------------------------------------------------------------------
  // Banderas (flagcdn.com) e íconos
  // ---------------------------------------------------------------------------
  var FLAG_BASE = "https://flagcdn.com/w40/";
  var COUNTRY_FLAGS = {
    "argentina": "ar", "ireland": "ie", "scotland": "gb-sct", "new zealand": "nz", "wales": "gb-wls",
    "japan": "jp", "france": "fr", "fiji": "fj", "england": "gb-eng", "australia": "au",
    "south africa": "za", "italy": "it", "uruguay": "uy", "chile": "cl", "brazil": "br",
    "spain": "es", "germany": "de", "portugal": "pt", "usa": "us", "united states": "us"
  };
  function flagUrl(code, color) {
    if (!code) return "";
    if (code === "globe") {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="' + (color || "#94a3b8") + '"/>' +
        '<g fill="none" stroke="#0a1128" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3.6 3.2 13.4 0 17M12 3.5c-3.2 3.6-3.2 13.4 0 17"/></g></svg>';
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }
    return FLAG_BASE + code + ".png";
  }
  function flagForName(name) { return flagUrl(COUNTRY_FLAGS[String(name || "").toLowerCase().trim()]); }

  // ---------------------------------------------------------------------------
  // Fechas (siempre en hora Argentina)
  // ---------------------------------------------------------------------------
  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtTime = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtDay = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric" });

  function dayKeyOf(date) { return fmtKey.format(date); } // "YYYY-MM-DD" en hora Argentina

  function addDays(key, n) { // aritmética de calendario pura sobre "YYYY-MM-DD"
    var p = key.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function compact(key) { return key.replace(/-/g, ""); }
  function todayKey() { return dayKeyOf(new Date()); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function dayLabel(key) {
    var t = todayKey();
    if (key === t) return "Hoy";
    if (key === addDays(t, 1)) return "Mañana";
    if (key === addDays(t, -1)) return "Ayer";
    var p = key.split("-").map(Number);
    return cap(fmtDay.format(new Date(Date.UTC(p[0], p[1] - 1, p[2], 12))).replace(".", "").replace(/-/g, "/"));
  }

  // ---------------------------------------------------------------------------
  // ESPN
  // ---------------------------------------------------------------------------
  var cache = new Map();

  function fetchJson(url, ttl) {
    var hit = cache.get(url);
    if (hit && Date.now() - hit.t < ttl) return Promise.resolve(hit.data);

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 12000);
    return fetch(url, { signal: ctrl.signal, headers: { Accept: "application/json" } })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) { cache.set(url, { t: Date.now(), data: data }); return data; })
      .finally(function () { clearTimeout(timer); });
  }

  var STATE_ES = {
    "HT": "Entretiempo", "Halftime": "Entretiempo", "FT": "Final", "Final": "Final",
    "FT-Pens": "Final (penales)", "AET": "Final (alargue)", "Final/OT": "Final (alargue)",
    "Full Time": "Final", "Half Time": "Entretiempo", "End of 1st": "Fin 1° cuarto",
    "End of 2nd": "Fin 2° cuarto", "End of 3rd": "Fin 3° cuarto", "End of 4th": "Fin 4° cuarto"
  };
  function es(txt) { return STATE_ES[txt] || txt; }

  // Devuelve { status: live|upcoming|finished, detail }
  function parseStatus(st) {
    var type = (st && st.type) || {};
    var name = String(type.name || "").toUpperCase();
    var state = String(type.state || "").toLowerCase();
    var short = type.shortDetail || "";

    if (name.indexOf("POSTPONED") > -1) return { status: "upcoming", detail: "Postergado" };
    if (name.indexOf("CANCEL") > -1) return { status: "upcoming", detail: "Cancelado" };
    if (name.indexOf("SUSPENDED") > -1) return { status: "finished", detail: "Suspendido" };
    if (name.indexOf("ABANDONED") > -1) return { status: "finished", detail: "Abandonado" };
    if (name.indexOf("DELAYED") > -1 && state !== "in") return { status: "upcoming", detail: "Demorado" };

    if (state === "in" || name.indexOf("HALFTIME") > -1 || name.indexOf("OVERTIME") > -1 || name.indexOf("SHOOTOUT") > -1) {
      return { status: "live", detail: es(short) || (st && st.displayClock) || "En juego" };
    }
    if (type.completed || state === "post") {
      var d = es(short);
      return { status: "finished", detail: d && d !== "Final" ? d : "Final" };
    }
    return { status: "upcoming", detail: "" };
  }

  function parseEvent(ev, comp) {
    var c = ev.competitions && ev.competitions[0];
    if (!c || !c.competitors || c.competitors.length < 2) return null;

    var home = c.competitors.find(function (x) { return x.homeAway === "home"; }) || c.competitors[0];
    var away = c.competitors.find(function (x) { return x.homeAway === "away"; }) || c.competitors[1];

    function names(x) {
      var t = x.team || {};
      return [t.displayName, t.shortDisplayName, t.name, t.abbreviation].filter(Boolean).join(" ");
    }
    if (comp.teamFilter && !comp.teamFilter.test(names(home) + " " + names(away))) return null;

    var when = new Date(ev.date);
    if (isNaN(when)) return null;

    var s = parseStatus(ev.status);
    var detail = s.detail;

    var hasPens = home.shootoutScore !== undefined && away.shootoutScore !== undefined;
    if (hasPens) detail = (detail ? detail + " " : "") + "(pen. " + home.shootoutScore + "-" + away.shootoutScore + ")";

    function team(x) {
      var t = x.team || {};
      var nm = t.shortDisplayName || t.displayName || t.name || "A definir";
      var flag = comp.rugby ? flagForName(t.displayName || nm) : "";
      return { name: nm, logo: t.logo || flag, flag: flag, winner: !!x.winner, score: x.score };
    }

    return {
      id: comp.id + "-" + ev.id,
      comp: comp,
      ts: when.getTime(),
      dayKey: dayKeyOf(when),
      time: fmtTime.format(when),
      status: s.status,
      detail: detail,
      venue: c.venue && c.venue.fullName,
      home: team(home),
      away: team(away)
    };
  }

  // ESPN a veces rechaza rangos de fechas (HTTP 400). Si pasa, se pide por día o por mes.
  var rangeSupported = true;

  function scoreboard(src, fromKey, toKey, ttl) {
    function one(dates) { return fetchJson(ESPN + src + "/scoreboard?dates=" + dates + "&limit=300", ttl); }
    function merge(list) {
      var ok = list.filter(Boolean);
      if (!ok.length) throw new Error("sin respuesta");
      return { events: [].concat.apply([], ok.map(function (r) { return r.events || []; })) };
    }
    function split() {
      var keys = [], k = fromKey, months = {};
      while (k <= toKey) { keys.push(k); months[k.slice(0, 4) + k.slice(5, 7)] = 1; k = addDays(k, 1); }
      var calls = keys.length <= 4
        ? keys.map(function (d) { return compact(d); })      // pocos días: uno por día
        : Object.keys(months);                                // muchos días: uno por mes (YYYYMM)
      return Promise.all(calls.map(function (d) { return one(d).catch(function () { return null; }); })).then(merge);
    }
    if (fromKey === toKey) return one(compact(fromKey));
    if (!rangeSupported) return split();
    return one(compact(fromKey) + "-" + compact(toKey)).catch(function (err) {
      if (/HTTP 400/.test(String(err && err.message))) { rangeSupported = false; return split(); }
      throw err;
    });
  }

  // Trae una competencia para un rango de días [fromKey, toKey] (inclusive, hora Argentina)
  function loadCompetition(comp, fromKey, toKey, ttl, label) {
    // ESPN agrupa por día de EE.UU.: pedimos ±1 día y después filtramos por día argentino
    var wf = addDays(fromKey, -1), wt = addDays(toKey, 1);
    var ok = 0, seen = {}, out = [], diag = [];

    return Promise.all(comp.sources.map(function (src) {
      return scoreboard(src, wf, wt, ttl)
        .then(function (data) {
          ok++;
          var n = 0;
          (data.events || []).forEach(function (ev) {
            if (seen[ev.id]) return;
            var parsed = parseEvent(ev, comp);
            if (parsed && parsed.dayKey >= fromKey && parsed.dayKey <= toKey) {
              seen[ev.id] = true;
              out.push(parsed);
              n++;
            }
          });
          diag.push({ name: comp.label + (label || ""), src: src, ok: true, text: n + " partidos" });
        })
        .catch(function (err) {
          diag.push({ name: comp.label + (label || ""), src: src, ok: false, text: String((err && err.message) || err) });
        });
    })).then(function () {
      return { comp: comp, events: out, failed: ok === 0, diag: diag };
    });
  }

  // ---------------------------------------------------------------------------
  // Estado de la app
  // ---------------------------------------------------------------------------
  var LIVE_TTL = 20000;   // día elegido: se refresca seguido
  var SLOW_TTL = 300000;  // resultados anteriores y próximos partidos: cada 5 min

  var state = {
    tab: "Todos",
    dayKey: todayKey(),
    statusFilter: "all",
    events: [],
    upcoming: {},   // id de competencia -> próximos partidos (cuando ese día no hay)
    results: [],    // partidos finalizados de los últimos 14 días
    failedIds: {},
    failed: [],
    diag: [],
    loaded: false,
    token: 0,
    timer: null,
    updated: null
  };

  function isRange() { return state.tab === "Pumas"; }
  function compsForTab() {
    return COMPETITIONS.filter(function (c) { return state.tab === "Todos" || c.tab === state.tab; });
  }
  function byTs(a, b) { return a.ts - b.ts; }

  function load(showSkeleton) {
    var token = ++state.token;
    if (showSkeleton) { state.loaded = false; render(); }

    var today = todayKey(), dayKey = state.dayKey, range = isRange(), comps = compsForTab();
    var from, to;
    if (range) { from = addDays(today, -10); to = addDays(today, 45); } else { from = to = dayKey; }

    var dayP = Promise.all(comps.map(function (c) { return loadCompetition(c, from, to, range ? SLOW_TTL : LIVE_TTL); }));
    var resP = range ? Promise.resolve([]) : Promise.all(comps.map(function (c) {
      return loadCompetition(c, addDays(today, -13), today, SLOW_TTL, " (resultados)");
    }));

    Promise.all([dayP, resP]).then(function (both) {
      if (token !== state.token) return; // llegó una respuesta vieja
      var events = [], failed = [], failedIds = {}, diag = [], empties = [];
      both[0].forEach(function (r) {
        events = events.concat(r.events);
        diag = diag.concat(r.diag);
        if (r.failed) { failed.push(r.comp.label); failedIds[r.comp.id] = true; }
        else if (!r.events.length && !range) empties.push(r.comp);
      });
      var results = [];
      both[1].forEach(function (r) {
        results = results.concat(r.events.filter(function (e) { return e.status === "finished"; }));
      });

      // Competencias sin partidos ese día: buscamos los próximos
      return Promise.all(empties.map(function (c) {
        return loadCompetition(c, addDays(dayKey, 1), addDays(dayKey, 21), SLOW_TTL, " (próximos)");
      })).then(function (ups) {
        if (token !== state.token) return;
        var upcoming = {};
        ups.forEach(function (r) {
          upcoming[r.comp.id] = r.events.filter(function (e) { return e.status === "upcoming"; }).sort(byTs).slice(0, 4);
        });
        state.events = events; state.failed = failed; state.failedIds = failedIds; state.diag = diag;
        state.results = results; state.upcoming = upcoming;
        state.loaded = true; state.updated = new Date();
        render();
        schedule();
      });
    });
  }

  function schedule() {
    clearTimeout(state.timer);
    var live = state.events.some(function (e) { return e.status === "live"; });
    state.timer = setTimeout(function () {
      if (document.hidden) return schedule();
      load(false);
    }, live ? 30000 : 60000);
  }

  // ---------------------------------------------------------------------------
  // Render (DOM seguro: todo el texto va por textContent)
  // ---------------------------------------------------------------------------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k === "style") el.setAttribute("style", attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var ch = arguments[i];
      if (ch) el.appendChild(typeof ch === "string" ? document.createTextNode(ch) : ch);
    }
    return el;
  }
  var $ = function (id) { return document.getElementById(id); };

  function flagImg(comp, cls) {
    var src = flagUrl(comp.flag, comp.color);
    if (!src) return null;
    var img = h("img", { class: cls || "flag", src: src, alt: "", loading: "lazy" });
    img.addEventListener("error", function () { img.style.visibility = "hidden"; });
    return img;
  }

  // Botones de filtro con banderita
  function renderFilters() {
    var nav = $("filters");
    nav.textContent = "";
    TABS.forEach(function (t) {
      var comp = COMPETITIONS.filter(function (c) { return c.tab === t; })[0];
      var kids = [];
      if (comp) kids.push(flagImg(comp));
      else kids.push(h("span", { class: "filter__all", text: "⚽" }));
      kids.push(h("span", { text: t }));
      var b = h.apply(null, ["button", { type: "button", class: "filter" + (t === state.tab ? " is-active" : "") }].concat(kids));
      b.addEventListener("click", function () { setTab(t); });
      nav.appendChild(b);
    });
    var act = nav.querySelector(".is-active");
    if (act && act.scrollIntoView) act.scrollIntoView({ block: "nearest", inline: "center" });
  }

  function renderDays() {
    var box = $("days");
    box.hidden = isRange();
    box.textContent = "";
    if (isRange()) return;
    var today = todayKey();
    for (var i = -3; i <= 3; i++) {
      (function (key) {
        var p = key.split("-");
        var lab = dayLabel(key);
        var sub = Number(p[2]) + "/" + Number(p[1]);
        var named = lab === "Hoy" || lab === "Mañana" || lab === "Ayer";
        var btn = h("button", { type: "button", class: "day" + (key === state.dayKey ? " is-active" : ""), role: "tab" },
          h("small", { text: named ? sub : lab.split(" ")[0] }),
          h("strong", { text: named ? lab : sub })
        );
        btn.addEventListener("click", function () { state.dayKey = key; renderDays(); load(true); });
        box.appendChild(btn);
      })(addDays(today, i));
    }
  }

  function matchRow(e, showDate) {
    var live = e.status === "live";
    var upcoming = e.status === "upcoming";
    var finished = e.status === "finished";
    var hs = parseFloat(e.home.score), as = parseFloat(e.away.score);
    var hWin = finished && (e.home.winner || hs > as);
    var aWin = finished && (e.away.winner || as > hs);

    function teamEl(t, away, win) {
      var kids = [h("span", { text: t.name })];
      if (t.logo) {
        var img = h("img", { src: t.logo, alt: "", loading: "lazy" });
        img.addEventListener("error", function () {
          if (t.flag && img.src.indexOf(t.flag) === -1) img.src = t.flag;
          else img.style.visibility = "hidden";
        });
        kids = away ? kids.concat([img]) : [img].concat(kids);
      }
      return h.apply(null, ["div", { class: "team" + (away ? " team--away" : "") + (win ? " is-winner" : "") }].concat(kids));
    }

    var score = h("div", { class: "score" });
    if (upcoming) {
      score.appendChild(h("span", { class: "score__vs", text: e.detail || "vs" }));
    } else {
      var hv = e.home.score != null && e.home.score !== "" ? e.home.score : "-";
      var av = e.away.score != null && e.away.score !== "" ? e.away.score : "-";
      score.appendChild(h("span", { class: "score__nums", text: hv + " - " + av }));
      if (e.detail) score.appendChild(h("span", { class: "score__detail", text: e.detail }));
    }

    var when = h("div", { class: "event__when" },
      h("span", { class: "event__time", text: e.time }),
      showDate ? h("span", { class: "event__date", text: dayLabel(e.dayKey) }) : null
    );

    var row = h("article", { class: "event" + (live ? " is-live" : "") },
      when,
      h("div", { class: "event__match" }, teamEl(e.home, false, hWin), score, teamEl(e.away, true, aWin))
    );
    if (e.venue) row.appendChild(h("div", { class: "event__venue", text: e.venue }));
    return row;
  }

  // o: { title, showDate, note, count }
  function group(comp, events, o) {
    o = o || {};
    var title = h("h2", { class: "group__title", style: "--c:" + comp.color },
      flagImg(comp), o.title || comp.label);
    if (o.count !== false) title.appendChild(h("span", { class: "group__count", text: " " + events.length }));
    var g = h("section", { class: "group" }, title);
    if (o.note) g.appendChild(h("p", { class: "group__note", text: o.note }));
    events.forEach(function (e) { g.appendChild(matchRow(e, o.showDate)); });
    return g;
  }

  function renderResults() {
    var box = $("results");
    box.textContent = "";
    box.hidden = isRange();
    if (isRange()) return;

    var today = todayKey();
    var wins = [
      { title: "Resultados de la fecha", sub: "últimos 7 días", from: addDays(today, -6), to: today, open: true },
      { title: "Fecha anterior", sub: "hace 8 a 14 días", from: addDays(today, -13), to: addDays(today, -7), open: false }
    ];

    wins.forEach(function (w) {
      var list = state.results.filter(function (e) { return e.dayKey >= w.from && e.dayKey <= w.to; });
      var det = h("details", { class: "results__block" },
        h("summary", {}, h("strong", { text: w.title }), h("span", { class: "results__sub", text: " · " + w.sub + " · " + list.length })));
      if (w.open) det.setAttribute("open", "");

      if (!list.length) {
        det.appendChild(h("p", { class: "group__note", text: "Sin resultados en este período." }));
      } else {
        compsForTab().forEach(function (comp) {
          var evs = list.filter(function (e) { return e.comp.id === comp.id; }).sort(function (a, b) { return b.ts - a.ts; });
          if (evs.length) det.appendChild(group(comp, evs, { showDate: true }));
        });
      }
      box.appendChild(det);
    });
  }

  function render() {
    renderFilters();
    renderResults();

    var content = $("content");
    content.textContent = "";

    if (!state.loaded) {
      for (var i = 0; i < 5; i++) content.appendChild(h("div", { class: "skeleton" }));
      return;
    }

    // Estadísticas (sobre todos los eventos de la vista)
    var count = { live: 0, upcoming: 0, finished: 0 };
    state.events.forEach(function (e) { count[e.status]++; });
    $("statTotal").textContent = state.events.length;
    $("statLive").textContent = count.live;
    $("statUpcoming").textContent = count.upcoming;
    $("statFinished").textContent = count.finished;

    // Aviso de ligas que no cargaron
    var w = $("warning");
    if (state.failed.length) {
      w.hidden = false;
      w.textContent = "No se pudieron cargar: " + state.failed.join(", ") + ". Se reintenta automáticamente.";
    } else { w.hidden = true; }

    var dl = $("diagList");
    dl.textContent = "";
    state.diag.forEach(function (d) {
      dl.appendChild(h("li", { class: d.ok ? "" : "bad", text: (d.ok ? "OK · " : "Error · ") + d.name + " (" + d.src + "): " + d.text }));
    });
    $("updatedAt").textContent = state.updated ? "Última actualización: " + fmtTime.format(state.updated) : "";

    var list = state.events.filter(function (e) { return state.statusFilter === "all" || e.status === state.statusFilter; });

    if (isRange()) {
      if (!list.length) {
        content.appendChild(h("div", { class: "empty" }, h("strong", { text: "No hay partidos de Los Pumas en este período" }),
          state.failed.length ? "No se pudo conectar con ESPN. Revisá tu conexión." : "Probá con otro filtro de estado."));
        return;
      }
      // Pumas: lista cronológica agrupada por día
      var byDay = {};
      list.forEach(function (e) { (byDay[e.dayKey] = byDay[e.dayKey] || []).push(e); });
      Object.keys(byDay).sort().forEach(function (k) {
        var evs = byDay[k].sort(byTs);
        content.appendChild(group(evs[0].comp, evs, { title: dayLabel(k) + " · " + evs[0].comp.label, count: false }));
      });
      return;
    }

    // Una sección por competencia. Con partidos arriba (en vivo primero);
    // sin partidos ese día: se muestran los próximos con su fecha.
    var byComp = {};
    list.forEach(function (e) { (byComp[e.comp.id] = byComp[e.comp.id] || []).push(e); });
    var withEvents = [], empty = [];
    compsForTab().forEach(function (comp) {
      var evs = (byComp[comp.id] || []).sort(byTs);
      if (evs.length) withEvents.push({ comp: comp, evs: evs, live: evs.some(function (e) { return e.status === "live"; }), first: evs[0].ts });
      else empty.push(comp);
    });
    withEvents.sort(function (a, b) { return (b.live - a.live) || (a.first - b.first); });
    withEvents.forEach(function (g) { content.appendChild(group(g.comp, g.evs)); });

    if (state.statusFilter === "all") {
      empty.forEach(function (comp) {
        if (state.failedIds[comp.id]) {
          content.appendChild(group(comp, [], { count: false, note: "No se pudo cargar. Se reintenta solo." }));
          return;
        }
        var next = state.upcoming[comp.id] || [];
        content.appendChild(group(comp, next, {
          count: false,
          showDate: true,
          note: next.length ? "Sin partidos este día. Próximos partidos:" : "Sin partidos este día ni en los próximos 21 días."
        }));
      });
    } else if (!withEvents.length) {
      content.appendChild(h("div", { class: "empty" }, h("strong", { text: "No hay partidos con ese estado" }), "Probá con otro filtro."));
    }
  }

  // ---------------------------------------------------------------------------
  // Interacción
  // ---------------------------------------------------------------------------
  function setTab(t) {
    state.tab = t;
    state.statusFilter = "all";
    document.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("is-active", c.dataset.status === "all"); });
    try { history.replaceState(null, "", "#" + encodeURIComponent(t.toLowerCase())); } catch (e) { /* file:// */ }
    renderDays();
    load(true);
  }

  function tickClock() {
    var el = $("clock");
    if (!el) return;
    var now = new Date();
    el.textContent = dayLabel(todayKey()) + " · " + fmtTime.format(now) + " (ARG)";
  }

  function init() {
    var hash = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    var found = TABS.filter(function (t) { return t.toLowerCase() === hash; })[0];
    if (found) state.tab = found;

    document.querySelectorAll(".chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        state.statusFilter = chip.dataset.status;
        document.querySelectorAll(".chip").forEach(function (c) { c.classList.toggle("is-active", c === chip); });
        render();
      });
    });

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { tickClock(); load(false); } // al volver a la pestaña, refresca
    });

    tickClock();
    setInterval(tickClock, 30000);
    renderFilters();
    renderDays();
    load(true);
  }

  init();
})();

</script>
</body>
</html>
