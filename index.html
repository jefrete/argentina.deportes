<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070d22">
  <title>Deportes Hoy - Horario Argentina</title>
  <meta name="description" content="Partidos, resultados y posiciones del día con horario de Argentina: Liga Profesional, copas, Europa, selecciones europeas y sudamericanas, y Los Pumas.">

  <!-- Fuentes: Barlow Condensed (títulos y números) + Manrope (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">

  <!-- Animate.css: entrada suave de las secciones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <!-- Lucide: íconos -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>

  <style>
    /* ===================== Base ===================== */
    :root {
      --ink: #070d22;
      --panel: #101a3d;
      --panel2: #18265a;
      --line: #26377a;
      --celeste: #75aadb;
      --gold: #f6b40e;
      --live: #ff5d73;
      --muted: #94a3b8;
      --soft: #cbd5e1;
      --font-display: "Barlow Condensed", Impact, sans-serif;
      --font-sans: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--ink); color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: #eef3ff;
      background-color: var(--ink);
      background-image: radial-gradient(900px 420px at 50% -140px, rgba(27, 58, 122, .75), transparent);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button { font-family: inherit; cursor: pointer; }
    h2, h3, h4, p, ul { margin: 0; }
    .hidden { display: none !important; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #filters, #days { scrollbar-width: none; }
    #filters::-webkit-scrollbar, #days::-webkit-scrollbar { display: none; }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .animate__animated { animation: none !important; } }

    /* ===================== Íconos ===================== */
    .icon { width: 16px; height: 16px; flex-shrink: 0; }
    .icon-xs { width: 14px; height: 14px; }
    .icon-lg { width: 20px; height: 20px; }
    .icon-xl { width: 24px; height: 24px; }
    .c-muted { color: var(--muted); }
    .c-live { color: var(--live); }
    .c-gold { color: var(--gold); }
    .c-green { color: #34d399; }

    /* ===================== Header (sin divs: el header es el contenedor flex) ===================== */
    .site-header {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-around;
      gap: 8px 16px;
      padding: 18px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(to bottom, #16296a, #0d1745);
    }
    .site-header::before { /* franja celeste-blanca-celeste */
      content: "";
      position: absolute; top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(to right, var(--celeste), #fff, var(--celeste));
    }
    .site-header::after { /* trama de puntos */
      content: "";
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: .07;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .site-header > * { position: relative; z-index: 1; }
    .logo { height: 56px; width: auto; max-width: none; flex-shrink: 0; object-fit: contain; display: block; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; }
    .clock {
      display: flex; align-items: center; gap: 6px; white-space: nowrap;
      font-family: var(--font-display); font-size: 1.125rem; font-weight: 700;
      letter-spacing: .025em; color: var(--celeste);
    }
    .link-pos {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .75rem; font-weight: 600; color: var(--soft); text-decoration: none;
    }
    .link-pos:hover { color: #fff; }
    @media (min-width: 640px) {
      .logo { height: 80px; }
      .clock { font-size: 1.25rem; }
    }

    /* ===================== Menú de competencias ===================== */
    #filters {
      position: sticky; top: 0; z-index: 30;
      display: flex; gap: 8px; overflow-x: auto;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 13, 34, .85);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .pill {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      padding: 6px 14px 6px 10px; border-radius: 9999px;
      border: 1px solid var(--line); background: var(--panel); color: #f1f5f9;
      font-size: 13px; font-weight: 600;
      transition: border-color .15s, transform .15s;
    }
    .pill:hover { border-color: var(--celeste); transform: translateY(-1px); }
    .pill.is-on {
      background: linear-gradient(135deg, var(--celeste), #a9ccee);
      color: var(--ink); border-color: transparent;
      box-shadow: 0 10px 15px -3px rgba(117, 170, 219, .3);
    }
    .pill.is-on:hover { transform: none; }
    .flag {
      height: 15px; width: 22px; border-radius: 3px; object-fit: cover;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .2);
    }

    /* ===================== Layout principal ===================== */
    main { max-width: 48rem; margin: 0 auto; padding: 20px 16px 64px; }

    #days { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
    .day {
      min-width: 4.8rem; flex-shrink: 0; padding: 6px 12px; line-height: 1.25; text-align: center;
      border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: #f1f5f9;
      transition: border-color .15s;
    }
    .day:hover { border-color: var(--celeste); }
    .day small { display: block; font-size: 11px; color: var(--muted); }
    .day strong { font-size: 13px; font-weight: 700; }
    .day.is-on { background: var(--gold); border-color: var(--gold); color: #1c1500; }
    .day.is-on small { color: rgba(28, 21, 0, .7); }

    /* ===================== Estadísticas ===================== */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
    .stat {
      padding: 10px 8px; text-align: center;
      border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
    }
    .stat .icon { display: block; margin: 0 auto; }
    .stat strong {
      display: block; margin-top: 4px;
      font-family: var(--font-display); font-size: 1.875rem; font-weight: 800; line-height: 1;
    }
    .stat span { font-size: 11px; color: var(--muted); }

    .chips-wrap { display: flex; justify-content: center; margin-bottom: 24px; }
    #chips { display: inline-flex; padding: 4px; border-radius: 9999px; border: 1px solid var(--line); background: var(--panel); }
    .chip {
      padding: 6px 14px; border: 0; border-radius: 9999px; background: transparent;
      color: var(--soft); font-size: 12px; font-weight: 700; transition: color .15s;
    }
    .chip:hover { color: #fff; }
    .chip.is-on { background: var(--celeste); color: var(--ink); }

    .warning {
      margin-bottom: 16px; padding: 8px 12px; border-radius: 12px;
      border: 1px solid rgba(246, 180, 14, .5); background: rgba(246, 180, 14, .1);
      font-size: 13px; color: #fcd34d;
    }

    /* ===================== Partidos ===================== */
    .comp-block { margin-bottom: 36px; }
    .comp-block--day { margin-bottom: 28px; }
    .sec-title {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      font-family: var(--font-display); font-size: 1.25rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em;
    }
    .sec-count { font-family: var(--font-sans); font-size: 14px; font-weight: 600; color: var(--muted); }
    @media (min-width: 640px) { .sec-title { font-size: 1.5rem; } }

    .live-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 9999px; background: rgba(255, 93, 115, .15);
      font-family: var(--font-sans); font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--live);
    }
    .live-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }

    .note {
      margin-top: 8px; padding: 8px 12px; border-radius: 12px;
      border: 1px dashed var(--line); background: rgba(16, 26, 61, .5);
      font-size: 14px; color: var(--muted);
    }
    .list { margin-top: 10px; display: grid; gap: 8px; }

    .match {
      padding: 10px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel);
      transition: border-color .15s;
    }
    .match:hover { border-color: var(--celeste); }
    .match.is-live {
      border-color: rgba(255, 93, 115, .7);
      background: linear-gradient(to right, rgba(255, 93, 115, .15), var(--panel));
      box-shadow: 0 10px 15px -3px rgba(255, 93, 115, .1);
    }
    .match-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; min-width: 0; }
    .match-time { font-family: var(--font-display); font-size: 1.25rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
    .match-time.is-live { color: var(--live); }
    .match-date { font-size: 12px; font-weight: 700; color: var(--gold); }
    .match-venue { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted); }
    .match-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; }

    .team { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
    .team-away { justify-content: flex-end; text-align: right; }
    .team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #e2e8f0; }
    .team-name.is-win { font-weight: 800; color: #fff; }
    .team-logo { width: 28px; height: 28px; flex-shrink: 0; object-fit: contain; }
    @media (min-width: 640px) {
      .team { font-size: 14px; }
      .team-logo { width: 32px; height: 32px; }
    }

    .score { min-width: 4.6rem; text-align: center; }
    .score-vs { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--muted); }
    .score-num {
      display: block; font-family: var(--font-display); font-size: 1.7rem; font-weight: 800;
      line-height: 1; letter-spacing: .025em; font-variant-numeric: tabular-nums; color: #fff;
    }
    .score-num.is-live { color: var(--live); }
    .score-detail { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
    .score-detail.is-live { font-weight: 700; color: var(--live); }

    .results { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(38, 55, 122, .6); }
    .results-title {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-display); font-size: 1rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .05em; color: var(--soft);
    }
    .results-empty { padding-top: 8px; font-size: 14px; color: var(--muted); }

    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .empty strong { display: block; margin-bottom: 4px; color: #f1f5f9; }

    .skeleton { height: 64px; margin-bottom: 8px; border-radius: 16px; background: var(--panel); animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }
    .skeleton-row { height: 20px; margin: 12px; border-radius: 4px; background: var(--panel2); animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite; }

    /* ===================== Posiciones ===================== */
    .standings-section { margin-top: 16px; scroll-margin-top: 64px; }
    .standings-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-top: 32px; border-top: 1px solid var(--line); }
    .standings-head h2 { font-family: var(--font-display); font-size: 1.875rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }

    .stand-card { margin-bottom: 16px; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: rgba(16, 26, 61, .6); }
    .stand-sum { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; }
    .stand-sum::-webkit-details-marker { display: none; }
    .stand-name { font-family: var(--font-display); font-size: 1.125rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .stand-chev { margin-left: auto; display: inline-flex; color: var(--muted); transition: transform .2s; }
    .stand-card[open] .stand-chev { transform: rotate(180deg); }
    .stand-body { border-top: 1px solid rgba(38, 55, 122, .6); }
    .stand-msg { padding: 16px; font-size: 14px; color: var(--muted); }
    .group-name { padding: 6px 16px; background: rgba(24, 38, 90, .5); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--soft); }
    .table-wrap { overflow-x: auto; }
    .stand-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
    .stand-table thead tr { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .stand-table th { padding: 8px 6px; text-align: center; font-weight: 600; }
    .stand-table th.th-pos { width: 32px; padding: 8px 6px; }
    .stand-table th.th-team { padding: 8px; text-align: left; }
    .stand-table tbody tr { border-top: 1px solid rgba(38, 55, 122, .6); }
    .stand-table tbody tr:hover { background: rgba(24, 38, 90, .6); }
    .stand-table td { padding: 8px 6px; text-align: center; white-space: nowrap; color: var(--soft); }
    .stand-table td.td-pos { padding: 8px; font-size: 12px; font-weight: 700; }
    .stand-table td.td-team { width: 100%; max-width: 0; padding: 8px; text-align: left; white-space: normal; }
    .stand-table td.strong { font-weight: 800; color: #fff; }
    .team-cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .team-cell img { width: 20px; height: 20px; flex-shrink: 0; object-fit: contain; }
    .team-cell span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #f1f5f9; }
    .col-wide { display: none; }
    @media (min-width: 640px) {
      .col-wide { display: table-cell; }
      .stand-table th, .stand-table td { padding-left: 8px; padding-right: 8px; }
    }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 8px 12px; list-style: none; border-top: 1px solid rgba(38, 55, 122, .6); font-size: 11px; color: var(--muted); }
    .legend li { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* ===================== Footer ===================== */
    footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--muted); }
    #updatedAt { margin-top: 4px; }
    footer details { margin-top: 12px; text-align: left; }
    footer summary { cursor: pointer; text-align: center; }
    #diagList { margin-top: 8px; padding-left: 20px; list-style: disc; }
    #diagList li { margin-bottom: 2px; }
    #diagList li.diag-err { color: #fca5a5; }
    .noscript { padding: 24px; text-align: center; }
  </style>
</head>
<body>

  <!-- Header: el propio header es el contenedor flex (space-around), sin divs de por medio -->
  <header class="site-header">
    <img src="logo.jpg" alt="Logo" class="logo">
    <section class="header-right">
      <span class="clock"><i data-lucide="clock-3" class="icon"></i><span id="clock"></span></span>
      <a href="#posiciones" class="link-pos">Ver posiciones <i data-lucide="arrow-down" class="icon icon-xs"></i></a>
    </section>
  </header>

  <nav id="filters" aria-label="Competencias"></nav>

  <main>

    <div id="days" role="tablist" aria-label="Día"></div>

    <div class="stats">
      <div class="stat">
        <i data-lucide="layers" class="icon c-muted"></i>
        <strong id="statTotal">0</strong>
        <span>Total</span>
      </div>
      <div class="stat">
        <i data-lucide="radio" class="icon c-live"></i>
        <strong id="statLive" class="c-live">0</strong>
        <span>En vivo</span>
      </div>
      <div class="stat">
        <i data-lucide="clock" class="icon c-gold"></i>
        <strong id="statUpcoming">0</strong>
        <span>Próximos</span>
      </div>
      <div class="stat">
        <i data-lucide="check-check" class="icon c-green"></i>
        <strong id="statFinished" style="color:#cbd5e1">0</strong>
        <span>Finalizados</span>
      </div>
    </div>

    <div class="chips-wrap">
      <div id="chips" role="group" aria-label="Estado">
        <button type="button" class="chip" data-status="all">Todos</button>
        <button type="button" class="chip" data-status="live">En vivo</button>
        <button type="button" class="chip" data-status="upcoming">Próximos</button>
        <button type="button" class="chip" data-status="finished">Finalizados</button>
      </div>
    </div>

    <div id="warning" class="warning hidden"></div>

    <div id="content" aria-live="polite"></div>

    <section id="posiciones" class="standings-section">
      <div class="standings-head">
        <i data-lucide="trophy" class="icon icon-xl c-gold"></i>
        <h2>Posiciones</h2>
      </div>
      <div id="standings"></div>
    </section>

    <footer>
      <p>Datos de ESPN · Se actualiza solo (30 s en vivo, 60 s el resto) · Horarios de Argentina (UTC-3)</p>
      <p id="updatedAt"></p>
      <details>
        <summary>Detalle de fuentes</summary>
        <ul id="diagList"></ul>
      </details>
    </footer>
  </main>

  <noscript><p class="noscript">Esta página necesita JavaScript.</p></noscript>

  <script>
/* Deportes Hoy - Horario Argentina
 * Datos: API pública de ESPN (se consulta directo desde el navegador).
 * Fechas siempre en hora de Argentina (America/Argentina/Buenos_Aires).
 * Estilos: CSS propio (sin frameworks). Íconos: Lucide. Banderas: flagcdn.
 */
(function () {
  "use strict";

  var TZ = "America/Argentina/Buenos_Aires";
  var ESPN = "https://site.api.espn.com/apis/site/v2/sports/";
  var ESPN_V2 = "https://site.api.espn.com/apis/v2/sports/"; // posiciones

  // ---------------------------------------------------------------------------
  // Filtros de selecciones. Los amistosos (soccer/fifa.friendly) traen a todo el
  // mundo, así que cada pestaña se queda solo con los equipos de su confederación.
  // ---------------------------------------------------------------------------
  var SUDAMERICA_RE = /\b(argentina|brazil|brasil|uruguay|chile|colombia|ecuador|peru|per[uú]|paraguay|bolivia|venezuela)\b/i;
  var EUROPA_RE = new RegExp("\\b(" + [
    "england", "scotland", "wales", "northern ireland", "ireland", "france", "germany", "spain", "portugal",
    "italy", "netherlands", "belgium", "croatia", "switzerland", "austria", "denmark", "sweden", "norway",
    "finland", "iceland", "poland", "czechia", "czech republic", "slovakia", "slovenia", "serbia", "bosnia",
    "montenegro", "north macedonia", "albania", "kosovo", "greece", "turkey", "t[uü]rkiye", "bulgaria",
    "romania", "hungary", "ukraine", "georgia", "armenia", "azerbaijan", "israel", "kazakhstan", "cyprus",
    "malta", "luxembourg", "estonia", "latvia", "lithuania", "moldova", "belarus", "russia", "faroe",
    "andorra", "san marino", "gibraltar", "liechtenstein"
  ].join("|") + ")\\b", "i");

  // ---------------------------------------------------------------------------
  // Competencias, en el orden en que aparecen en la página y en el menú.
  // ---------------------------------------------------------------------------
  var COMPETITIONS = [
    { id: "argentina", flag: "ar", tab: "Liga Argentina", label: "Liga Profesional", color: "#75aadb",
      sources: ["soccer/arg.1", "soccer/arg.copa_lpf"], standings: "soccer/arg.1" },
    { id: "copa-argentina", flag: "ar", tab: "Copa Argentina", label: "Copa Argentina", color: "#f6b40e",
      sources: ["soccer/arg.copa"], standings: null, noTable: "Torneo por eliminación directa: no tiene tabla de posiciones." },
    { id: "libertadores", flag: "globe", tab: "Libertadores", label: "Copa Libertadores", color: "#fbbf24",
      sources: ["soccer/conmebol.libertadores"], standings: "soccer/conmebol.libertadores" },
    { id: "sudamericana", flag: "globe", tab: "Sudamericana", label: "Copa Sudamericana", color: "#34d399",
      sources: ["soccer/conmebol.sudamericana"], standings: "soccer/conmebol.sudamericana" },
    { id: "champions", flag: "eu", tab: "Champions", label: "UEFA Champions League", color: "#818cf8",
      sources: ["soccer/uefa.champions"], standings: "soccer/uefa.champions" },
    { id: "premier", flag: "gb-eng", tab: "Premier", label: "Premier League", color: "#c084fc",
      sources: ["soccer/eng.1"], standings: "soccer/eng.1" },
    { id: "laliga", flag: "es", tab: "La Liga", label: "La Liga", color: "#fb923c",
      sources: ["soccer/esp.1"], standings: "soccer/esp.1" },
    { id: "seriea", flag: "it", tab: "Serie A", label: "Serie A", color: "#4ade80",
      sources: ["soccer/ita.1"], standings: "soccer/ita.1" },

    // Selecciones sudamericanas: eliminatorias, Copa América y amistosos (solo equipos CONMEBOL).
    { id: "selec-sudamerica", flag: "globe", tab: "Selec. Sudamérica", label: "Selecciones sudamericanas", color: "#38bdf8", lookahead: 60,
      teamFilter: SUDAMERICA_RE,
      sources: ["soccer/fifa.worldq.conmebol", "soccer/conmebol.america", "soccer/fifa.friendly"],
      standings: null, noTable: "Sin tabla de posiciones vigente por ahora: se muestra cuando haya eliminatorias en curso." },

    { id: "selec-europa", flag: "eu", tab: "Selec. Europa", label: "Selecciones europeas", color: "#a78bfa", lookahead: 60,
      teamFilter: EUROPA_RE,

    { id: "pumas", flag: "ar", rugby: true, noResults: true, lookahead: 60, tab: "Pumas", label: "Los Pumas", color: "#22d3ee",
      teamFilter: /argentina|pumas/i,
      // Rugby en ESPN: 17567 = Nations Championship 2026, 289234 = test matches, 244293 = Rugby Championship.
      sources: ["rugby/17567", "rugby/289234", "rugby/244293"], standings: "rugby/17567" }

  var TABS = ["Todos"].concat(COMPETITIONS.map(function (c) { return c.tab; }));

  // ---------------------------------------------------------------------------
  // Banderas (flagcdn.com) e íconos (Lucide)
  // ---------------------------------------------------------------------------
  var FLAG_BASE = "https://flagcdn.com/w40/";
  var COUNTRY_FLAGS = {
    "argentina": "ar", "ireland": "ie", "scotland": "gb-sct", "new zealand": "nz", "wales": "gb-wls",
    "japan": "jp", "france": "fr", "fiji": "fj", "england": "gb-eng", "australia": "au",
    "south africa": "za", "italy": "it", "uruguay": "uy", "chile": "cl", "brazil": "br",
    "spain": "es", "germany": "de", "portugal": "pt", "usa": "us", "united states": "us"
  };
  function flagUrl(code, color) {
    if (!code) return "";
    if (code === "globe") {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="' + (color || "#94a3b8") + '"/>' +
        '<g fill="none" stroke="#0a1128" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c3.2 3.6 3.2 13.4 0 17M12 3.5c-3.2 3.6-3.2 13.4 0 17"/></g></svg>';
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

  }
  function flagForName(name) { return flagUrl(COUNTRY_FLAGS[String(name || "").toLowerCase().trim()]); }

  // ---------------------------------------------------------------------------
  // Fechas (siempre en hora Argentina)
  // ---------------------------------------------------------------------------
  var fmtKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var fmtTime = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false });
  var fmtDay = new Intl.DateTimeFormat("es-AR", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric" });

  function dayKeyOf(date) { return fmtKey.format(date); } // "YYYY-MM-DD" en hora Argentina
  function pad(n) { return String(n).padStart(2, "0"); }
  function addDays(key, n) { // aritmética de calendario pura sobre "YYYY-MM-DD"
    var p = key.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  }
  function compact(key) { return key.replace(/-/g, ""); }
  function todayKey() { return dayKeyOf(new Date()); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function dayLabel(key) {
    var t = todayKey();
    if (key === t) return "Hoy";
    if (key === addDays(t, 1)) return "Mañana";
    if (key === addDays(t, -1)) return "Ayer";
    var p = key.split("-").map(Number);
    return cap(fmtDay.format(new Date(Date.UTC(p[0], p[1] - 1, p[2], 12))).replace(".", "").replace(/-/g, "/"));
  }

  // ---------------------------------------------------------------------------
  // ESPN: partidos
  // ---------------------------------------------------------------------------
  var cache = new Map();

  function fetchJson(url, ttl) {
    var hit = cache.get(url);
    if (hit && Date.now() - hit.t < ttl) return Promise.resolve(hit.data);

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 12000);
    return fetch(url, { signal: ctrl.signal, headers: { Accept: "application/json" } })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) { cache.set(url, { t: Date.now(), data: data }); return data; })
      .finally(function () { clearTimeout(timer); });
  }

  var STATE_ES = {
    "HT": "Entretiempo", "Halftime": "Entretiempo", "FT": "Final", "Final": "Final",
    "FT-Pens": "Final (penales)", "AET": "Final (alargue)", "Final/OT": "Final (alargue)",
    "Full Time": "Final", "Half Time": "Entretiempo"
  };
  function es(txt) { return STATE_ES[txt] || txt; }

  // Devuelve { status: live|upcoming|finished, detail }
  function parseStatus(st) {
    var type = (st && st.type) || {};
    var name = String(type.name || "").toUpperCase();
    var state = String(type.state || "").toLowerCase();
    var short = type.shortDetail || "";

    if (name.indexOf("POSTPONED") > -1) return { status: "upcoming", detail: "Postergado" };
    if (name.indexOf("CANCEL") > -1) return { status: "upcoming", detail: "Cancelado" };
    if (name.indexOf("SUSPENDED") > -1) return { status: "finished", detail: "Suspendido" };
    if (name.indexOf("ABANDONED") > -1) return { status: "finished", detail: "Abandonado" };
    if (name.indexOf("DELAYED") > -1 && state !== "in") return { status: "upcoming", detail: "Demorado" };

    if (state === "in" || name.indexOf("HALFTIME") > -1 || name.indexOf("OVERTIME") > -1 || name.indexOf("SHOOTOUT") > -1) {
      return { status: "live", detail: es(short) || (st && st.displayClock) || "En juego" };
    }
    if (type.completed || state === "post") {
      var d = es(short);
      return { status: "finished", detail: d && d !== "Final" ? d : "Final" };
    }
    return { status: "upcoming", detail: "" };
  }

  function parseEvent(ev, comp) {
    var c = ev.competitions && ev.competitions[0];
    if (!c || !c.competitors || c.competitors.length < 2) return null;

    var home = c.competitors.find(function (x) { return x.homeAway === "home"; }) || c.competitors[0];
    var away = c.competitors.find(function (x) { return x.homeAway === "away"; }) || c.competitors[1];

    function names(x) {
      var t = x.team || {};
      return [t.displayName, t.shortDisplayName, t.name, t.abbreviation].filter(Boolean).join(" ");
    }
    if (comp.teamFilter && !comp.teamFilter.test(names(home) + " " + names(away))) return null;

    var when = new Date(ev.date);
    if (isNaN(when)) return null;

    var s = parseStatus(ev.status);
    var detail = s.detail;
    var hasPens = home.shootoutScore !== undefined && away.shootoutScore !== undefined;
    if (hasPens) detail = (detail ? detail + " " : "") + "(pen. " + home.shootoutScore + "-" + away.shootoutScore + ")";

    function team(x) {
      var t = x.team || {};
      var nm = t.shortDisplayName || t.displayName || t.name || "A definir";
      var flag = comp.rugby ? flagForName(t.displayName || nm) : "";
      return { name: nm, logo: t.logo || flag, flag: flag, winner: !!x.winner, score: x.score };
    }

    return {
      id: comp.id + "-" + ev.id,
      comp: comp,
      ts: when.getTime(),
      dayKey: dayKeyOf(when),
      time: fmtTime.format(when),
      status: s.status,
      detail: detail,
      venue: c.venue && c.venue.fullName,
      home: team(home),
      away: team(away)
    };
  }

  // ESPN a veces rechaza rangos de fechas (HTTP 400). Si pasa, se pide por día o por mes.
  var rangeSupported = true;

  function scoreboard(src, fromKey, toKey, ttl) {
    function one(dates) { return fetchJson(ESPN + src + "/scoreboard?dates=" + dates + "&limit=300", ttl); }
    function merge(list) {
      var ok = list.filter(Boolean);
      if (!ok.length) throw new Error("sin respuesta");
      return { events: [].concat.apply([], ok.map(function (r) { return r.events || []; })) };
    }
    function split() {
      var keys = [], k = fromKey, months = {};
      while (k <= toKey) { keys.push(k); months[k.slice(0, 4) + k.slice(5, 7)] = 1; k = addDays(k, 1); }
      var calls = keys.length <= 4 ? keys.map(compact) : Object.keys(months); // pocos días: por día; muchos: por mes (YYYYMM)
      return Promise.all(calls.map(function (d) { return one(d).catch(function () { return null; }); })).then(merge);
    }
    if (fromKey === toKey) return one(compact(fromKey));
    if (!rangeSupported) return split();
    return one(compact(fromKey) + "-" + compact(toKey)).catch(function (err) {
      if (/HTTP 400/.test(String(err && err.message))) { rangeSupported = false; return split(); }
      throw err;
    });
  }

  // Trae una competencia para un rango de días [fromKey, toKey] (inclusive, hora Argentina)
  function loadCompetition(comp, fromKey, toKey, ttl, label) {
    // ESPN agrupa por día de EE.UU.: pedimos ±1 día y después filtramos por día argentino
    var wf = addDays(fromKey, -1), wt = addDays(toKey, 1);
    var ok = 0, seen = {}, out = [], diag = [];

    return Promise.all(comp.sources.map(function (src) {
      return scoreboard(src, wf, wt, ttl)
        .then(function (data) {
          ok++;
          var n = 0;
          (data.events || []).forEach(function (ev) {
            if (seen[ev.id]) return;
            var parsed = parseEvent(ev, comp);
            if (parsed && parsed.dayKey >= fromKey && parsed.dayKey <= toKey) {
              seen[ev.id] = true; out.push(parsed); n++;
            }
          });
          diag.push({ name: comp.label + (label || ""), src: src, ok: true, text: n + " partidos" });
        })
        .catch(function (err) {
          diag.push({ name: comp.label + (label || ""), src: src, ok: false, text: String((err && err.message) || err) });
        });
    })).then(function () {
      return { comp: comp, events: out, failed: ok === 0, diag: diag };
    });
  }

  // ---------------------------------------------------------------------------
  // ESPN: posiciones
  // ---------------------------------------------------------------------------
  var COLS = [
    { k: "PJ", names: ["gamesPlayed"], abbr: ["GP"] },
    { k: "G", names: ["wins"], abbr: ["W"] },
    { k: "E", names: ["ties", "draws"], abbr: ["D", "T"] },
    { k: "P", names: ["losses"], abbr: ["L"] },
    { k: "GF", names: ["pointsFor"], abbr: ["F", "PF"], wide: true },
    { k: "GC", names: ["pointsAgainst"], abbr: ["A", "PA"], wide: true },
    { k: "DG", names: ["pointDifferential"], abbr: ["GD", "PD"] },
    { k: "Pts", names: ["points"], abbr: ["P", "PTS"], strong: true }
  ];

  function statOf(entry, names, abbr) {
    var stats = entry.stats || [];
    for (var i = 0; i < stats.length; i++) {
      var s = stats[i];
      if (names.indexOf(s.name) > -1) return s;
    }
    for (var j = 0; j < stats.length; j++) {
      if (abbr && abbr.indexOf(stats[j].abbreviation) > -1 && stats[j].name !== "rank") return stats[j];
    }
    return null;
  }
  function statText(s) {
    if (!s) return "-";
    if (s.displayValue != null && s.displayValue !== "") return String(s.displayValue);
    return s.value != null ? String(s.value) : "-";
  }

  function parseStandings(data) {
    var groups = [];
    function walk(node, name) {
      var entries = node && node.standings && node.standings.entries;
      if (entries && entries.length) {
        var rows = entries.map(function (en, i) {
          var t = en.team || {};
          var rank = statOf(en, ["rank"], null);
          var pts = statOf(en, ["points"], ["P", "PTS"]);
          return {
            pos: rank && rank.value != null ? Number(rank.value) : i + 1,
            hasRank: !!(rank && rank.value != null),
            pts: pts && pts.value != null ? Number(pts.value) : 0,
            name: t.shortDisplayName || t.displayName || t.name || "Equipo",
            logo: (t.logos && t.logos[0] && t.logos[0].href) || t.logo || "",
            note: en.note && en.note.description ? { color: en.note.color || "", text: en.note.description } : null,
            cells: COLS.map(function (c) { return statText(statOf(en, c.names, c.abbr)); })
          };
        });
        if (rows.every(function (r) { return r.hasRank; })) rows.sort(function (a, b) { return a.pos - b.pos; });
        else rows.sort(function (a, b) { return b.pts - a.pts; });
        groups.push({ name: name || "", rows: rows });
      }
      (node && node.children || []).forEach(function (ch) { walk(ch, ch.name || ch.abbreviation || ""); });
    }
    walk(data, "");
    return groups;
  }

  // ---------------------------------------------------------------------------
  // Estado de la app
  // ---------------------------------------------------------------------------
  var LIVE_TTL = 20000;   // día elegido: se refresca seguido
  var SLOW_TTL = 300000;  // resultados anteriores y próximos partidos: cada 5 min
  var TABLE_TTL = 600000; // posiciones: cada 10 min

  var state = {
    tab: "Todos",
    dayKey: todayKey(),
    statusFilter: "all",
    events: [],
    upcoming: {},   // id de competencia -> próximos partidos (cuando ese día no hay)
    results: [],    // partidos finalizados de los últimos 30 días
    tables: {},     // id de competencia -> { ok, groups } | { error } | { loading } | { none }
    tableDiag: {},
    closed: {},     // posiciones que el usuario cerró
    failedIds: {},
    failed: [],
    diag: [],
    loaded: false,
    token: 0,
    timer: null,
    updated: null
  };

  function isRange() { return state.tab === "Pumas"; }
  function compsForTab() {
    return COMPETITIONS.filter(function (c) { return state.tab === "Todos" || c.tab === state.tab; });
  }
  function byTs(a, b) { return a.ts - b.ts; }

  function load(showSkeleton) {
    var token = ++state.token;
    if (showSkeleton) { state.loaded = false; render(); }

    var today = todayKey(), dayKey = state.dayKey, range = isRange(), comps = compsForTab();
    var from, to;
    if (range) { from = addDays(today, -10); to = addDays(today, 45); } else { from = to = dayKey; }

    var dayP = Promise.all(comps.map(function (c) { return loadCompetition(c, from, to, range ? SLOW_TTL : LIVE_TTL); }));
    var resP = range ? Promise.resolve([]) : Promise.all(comps.filter(function (c) { return !c.noResults; }).map(function (c) {
      return loadCompetition(c, addDays(today, -29), today, SLOW_TTL, " (resultados)");
    }));

    Promise.all([dayP, resP]).then(function (both) {
      if (token !== state.token) return; // llegó una respuesta vieja
      var events = [], failed = [], failedIds = {}, diag = [], empties = [];
      both[0].forEach(function (r) {
        events = events.concat(r.events);
        diag = diag.concat(r.diag);
        if (r.failed) { failed.push(r.comp.label); failedIds[r.comp.id] = true; }
        else if (!r.events.length && !range) empties.push(r.comp);
      });
      var results = [];
      both[1].forEach(function (r) {
        diag = diag.concat(r.diag);
        results = results.concat(r.events.filter(function (e) { return e.status === "finished"; }));
      });

      // Competencias sin partidos ese día: buscamos los próximos
      return Promise.all(empties.map(function (c) {
        return loadCompetition(c, addDays(dayKey, 1), addDays(dayKey, c.lookahead || 21), SLOW_TTL, " (próximos)");
      })).then(function (ups) {
        if (token !== state.token) return;
        var upcoming = {};
        ups.forEach(function (r) {
          upcoming[r.comp.id] = r.events.filter(function (e) { return e.status === "upcoming"; }).sort(byTs).slice(0, 4);
        });
        state.events = events; state.failed = failed; state.failedIds = failedIds; state.diag = diag;
        state.results = results; state.upcoming = upcoming;
        state.loaded = true; state.updated = new Date();
        render();
        if (showSkeleton) replay($("content"));
        schedule();
      });
    }).catch(function (err) {
      if (token !== state.token) return;
      if (window.console) console.error(err);
      state.loaded = true; state.failed = comps.map(function (c) { return c.label; });
      render();
    });
  }

  function loadTables() {
    compsForTab().forEach(function (c) {
      if (!c.standings) { state.tables[c.id] = { none: true }; return; }
      var cur = state.tables[c.id];
      if (cur && (cur.loading || (cur.ok && Date.now() - cur.t < TABLE_TTL))) return;
      if (!cur || !cur.ok) state.tables[c.id] = { loading: true };
      fetchJson(ESPN_V2 + c.standings + "/standings", TABLE_TTL).then(function (data) {
        var groups = parseStandings(data);
        state.tables[c.id] = { ok: true, t: Date.now(), groups: groups };
        state.tableDiag[c.id] = { ok: true, text: groups.length + " tablas" };
        renderStandings();
      }).catch(function (err) {
        state.tables[c.id] = { error: String((err && err.message) || err) };
        state.tableDiag[c.id] = { ok: false, text: String((err && err.message) || err) };
        renderStandings();
      });
    });
    renderStandings();
  }

  function schedule() {
    clearTimeout(state.timer);
    var live = state.events.some(function (e) { return e.status === "live"; });
    state.timer = setTimeout(function () {
      if (document.hidden) return schedule();
      load(false);
    }, live ? 30000 : 60000);
  }

  // ---------------------------------------------------------------------------
  // Render (DOM seguro: todo el texto va por textContent)
  // ---------------------------------------------------------------------------
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    });
    for (var i = 2; i < arguments.length; i++) {
      var ch = arguments[i];
      if (ch) el.appendChild(typeof ch === "string" ? document.createTextNode(ch) : ch);
    }
    return el;
  }
  var $ = function (id) { return document.getElementById(id); };

  function icon(name, cls) { return h("i", { "data-lucide": name, class: cls || "icon" }); }
  function refreshIcons() { try { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons(); } catch (e) { /* sin íconos */ } }
  function replay(el) { // reproduce la animación de entrada (Animate.css)
    if (!el) return;
    el.classList.remove("animate__animated", "animate__fadeInUp", "animate__faster");
    void el.offsetWidth;
    el.classList.add("animate__animated", "animate__fadeInUp", "animate__faster");
  }

  function flagImg(comp, cls) {
    var src = flagUrl(comp.flag, comp.color);
    if (!src) return null;
    var img = h("img", { class: cls || "flag", src: src, alt: "", loading: "lazy" });
    img.addEventListener("error", function () { img.style.visibility = "hidden"; });
    return img;
  }

  function renderFilters() {
    var nav = $("filters");
    nav.textContent = "";
    TABS.forEach(function (t) {
      var comp = COMPETITIONS.filter(function (c) { return c.tab === t; })[0];
      var lead = comp ? flagImg(comp) : icon("layout-grid", "icon");
      var b = h("button", { type: "button", class: "pill" + (t === state.tab ? " is-on" : "") }, lead, h("span", { text: t }));
      b.addEventListener("click", function () { setTab(t); });
      nav.appendChild(b);
    });
    var act = nav.querySelector(".is-on");
    if (act && act.scrollIntoView) { try { act.scrollIntoView({ block: "nearest", inline: "center" }); } catch (e) { /* viejo */ } }
  }

  function renderDays() {
    var box = $("days");
    box.classList.toggle("hidden", isRange());
    box.textContent = "";
    if (isRange()) return;
    var today = todayKey();
    for (var i = -3; i <= 3; i++) {
      (function (key) {
        var p = key.split("-");
        var lab = dayLabel(key);
        var sub = Number(p[2]) + "/" + Number(p[1]);
        var named = lab === "Hoy" || lab === "Mañana" || lab === "Ayer";
        var btn = h("button", { type: "button", class: "day" + (key === state.dayKey ? " is-on" : "") },
          h("small", { text: named ? sub : lab.split(" ")[0] }),
          h("strong", { text: named ? lab : sub })
        );
        btn.addEventListener("click", function () { state.dayKey = key; renderDays(); load(true); });
        box.appendChild(btn);
      })(addDays(today, i));
    }
  }

  function liveBadge() {
    return h("span", { class: "live-badge" }, h("span", { class: "dot" }), "EN VIVO");
  }

  function matchRow(e, showDate) {
    var live = e.status === "live", upcoming = e.status === "upcoming", finished = e.status === "finished";
    var hs = parseFloat(e.home.score), as = parseFloat(e.away.score);
    var hWin = finished && (e.home.winner || hs > as);
    var aWin = finished && (e.away.winner || as > hs);

    function teamEl(t, away, win) {
      var name = h("span", { class: "team-name" + (win ? " is-win" : ""), text: t.name });
      var kids = [name];
      if (t.logo) {
        var img = h("img", { src: t.logo, alt: "", loading: "lazy", class: "team-logo" });
        img.addEventListener("error", function () {
          if (t.flag && img.src.indexOf(t.flag) === -1) img.src = t.flag;
          else img.style.visibility = "hidden";
        });
        kids = away ? [name, img] : [img, name];
      }
      return h.apply(null, ["div", { class: "team" + (away ? " team-away" : "") }].concat(kids));
    }

    var score = h("div", { class: "score" });
    if (upcoming) {
      score.appendChild(h("span", { class: "score-vs", text: e.detail || "vs" }));
    } else {
      var hv = e.home.score != null && e.home.score !== "" ? e.home.score : "-";
      var av = e.away.score != null && e.away.score !== "" ? e.away.score : "-";
      score.appendChild(h("span", { class: "score-num" + (live ? " is-live" : ""), text: hv + " - " + av }));
      if (e.detail) score.appendChild(h("span", { class: "score-detail" + (live ? " is-live" : ""), text: e.detail }));
    }

    // Línea de arriba: hora (y fecha) a la izquierda, estadio a la derecha
    var meta = h("div", { class: "match-meta" },
      h("span", { class: "match-time" + (live ? " is-live" : ""), text: e.time }),
      showDate ? h("span", { class: "match-date", text: dayLabel(e.dayKey) }) : null,
      e.venue ? h("span", { class: "match-venue", text: e.venue }) : null
    );

    return h("article", { class: "match" + (live ? " is-live" : "") },
      meta,
      h("div", { class: "match-grid" }, teamEl(e.home, false, hWin), score, teamEl(e.away, true, aWin)));
  }

  function sectionTitle(comp, o) {
    o = o || {};
    var t = h("h2", { class: "sec-title", style: "color:" + comp.color }, flagImg(comp), o.title || comp.label);
    if (o.live) t.appendChild(liveBadge());
    if (o.count != null) t.appendChild(h("span", { class: "sec-count", text: String(o.count) }));
    return t;
  }

  function note(text) { return h("p", { class: "note", text: text }); }

  // o: { title, showDate, note, count }
  function daySection(comp, events, o) {
    o = o || {};
    var sec = h("section", {}, sectionTitle(comp, { title: o.title, count: o.count, live: events.some(function (e) { return e.status === "live"; }) }));
    if (o.note) sec.appendChild(note(o.note));
    if (events.length) {
      var list = h("div", { class: "list" });
      events.forEach(function (e) { list.appendChild(matchRow(e, o.showDate)); });
      sec.appendChild(list);
    }
    return sec;
  }

  // Últimos resultados de una competencia (los más recientes primero)
  function resultsBlock(comp) {
    var list = state.results
      .filter(function (e) { return e.comp.id === comp.id && e.dayKey !== state.dayKey; })
      .sort(function (a, b) { return b.ts - a.ts; })
      .slice(0, 5);

    var box = h("section", { class: "results" },
      h("h3", { class: "results-title" }, icon("history", "icon c-muted"), comp.label + " · últimos resultados"));
    if (!list.length) {
      box.appendChild(h("p", { class: "results-empty", text: "Sin resultados en los últimos 30 días." }));
    } else {
      var wrap = h("div", { class: "list" });
      list.forEach(function (e) { wrap.appendChild(matchRow(e, true)); });
      box.appendChild(wrap);
    }
    return box;
  }

  function render() {
    renderFilters();

    var content = $("content");
    content.textContent = "";

    if (!state.loaded) {
      for (var i = 0; i < 5; i++) content.appendChild(h("div", { class: "skeleton" }));
      refreshIcons();
      return;
    }

    // Estadísticas (sobre todos los eventos de la vista)
    var count = { live: 0, upcoming: 0, finished: 0 };
    state.events.forEach(function (e) { count[e.status]++; });
    $("statTotal").textContent = state.events.length;
    $("statLive").textContent = count.live;
    $("statUpcoming").textContent = count.upcoming;
    $("statFinished").textContent = count.finished;

    // Aviso de ligas que no cargaron
    var w = $("warning");
    if (state.failed.length) {
      w.classList.remove("hidden");
      w.textContent = "No se pudieron cargar: " + state.failed.join(", ") + ". Se reintenta automáticamente.";
    } else { w.classList.add("hidden"); }

    renderDiag();
    $("updatedAt").textContent = state.updated ? "Última actualización: " + fmtTime.format(state.updated) : "";

    var list = state.events.filter(function (e) { return state.statusFilter === "all" || e.status === state.statusFilter; });

    if (isRange()) {
      if (!list.length) {
        content.appendChild(h("div", { class: "empty" },
          h("strong", { text: "No hay partidos de Los Pumas en este período" }),
          state.failed.length ? "No se pudo conectar con ESPN. Revisá tu conexión." : "Probá con otro filtro de estado."));
        refreshIcons();
        return;
      }
      var byDay = {};
      list.forEach(function (e) { (byDay[e.dayKey] = byDay[e.dayKey] || []).push(e); });
      Object.keys(byDay).sort().forEach(function (k) {
        var evs = byDay[k].sort(byTs);
        var wrap = h("div", { class: "comp-block comp-block--day" });
        wrap.appendChild(daySection(evs[0].comp, evs, { title: dayLabel(k) + " · " + evs[0].comp.label }));
        content.appendChild(wrap);
      });
      refreshIcons();
      return;
    }

    // Orden fijo: cada competencia con su día y, justo debajo, sus últimos resultados.
    var any = false;
    compsForTab().forEach(function (comp) {
      var evs = list.filter(function (e) { return e.comp.id === comp.id; }).sort(byTs);
      var wrap = h("div", { class: "comp-block" });

      if (state.statusFilter !== "all") {      // filtro por estado: solo lo que coincide
        if (!evs.length) return;
        wrap.appendChild(daySection(comp, evs, { count: evs.length }));
        content.appendChild(wrap); any = true;
        return;
      }

      if (evs.length) {
        wrap.appendChild(daySection(comp, evs, { count: evs.length }));
      } else if (state.failedIds[comp.id]) {
        wrap.appendChild(daySection(comp, [], { note: "No se pudo cargar. Se reintenta solo." }));
      } else {
        var next = state.upcoming[comp.id] || [];
        wrap.appendChild(daySection(comp, next, {
          showDate: true,
          note: next.length ? "Sin partidos este día. Próximos partidos:" : "Sin partidos este día ni en los próximos " + (comp.lookahead || 21) + " días."
        }));
      }
      if (!comp.noResults) wrap.appendChild(resultsBlock(comp));
      content.appendChild(wrap); any = true;
    });

    if (!any) {
      content.appendChild(h("div", { class: "empty" },
        h("strong", { text: "No hay partidos con ese estado" }), "Probá con otro filtro."));
    }
    refreshIcons();
  }

  function renderDiag() {
    var dl = $("diagList");
    dl.textContent = "";
    state.diag.forEach(function (d) {
      dl.appendChild(h("li", { class: d.ok ? "" : "diag-err", text: (d.ok ? "OK · " : "Error · ") + d.name + " (" + d.src + "): " + d.text }));
    });
    compsForTab().forEach(function (c) {
      var d = state.tableDiag[c.id];
      if (d) dl.appendChild(h("li", { class: d.ok ? "" : "diag-err", text: (d.ok ? "OK · " : "Error · ") + c.label + " (posiciones " + c.standings + "): " + d.text }));
    });
  }

  // ---------------------------------------------------------------------------
  // Posiciones (abajo de todo)
  // ---------------------------------------------------------------------------
  function standingsTable(group) {
    var head = h("tr", {},
      h("th", { class: "th-pos", text: "#" }),
      h("th", { class: "th-team", text: "Equipo" }));
    COLS.forEach(function (c) {
      head.appendChild(h("th", { class: c.wide ? "col-wide" : "", text: c.k }));
    });
    var tbody = h("tbody");
    var notes = {};
    group.rows.forEach(function (r, i) {
      if (r.note) notes[r.note.text] = r.note.color;
      var color = r.note && r.note.color ? (/^#/.test(r.note.color) ? r.note.color : "#" + r.note.color) : "transparent";
      var logo = r.logo ? h("img", { src: r.logo, alt: "", loading: "lazy" }) : null;
      if (logo) logo.addEventListener("error", function () { logo.style.visibility = "hidden"; });
      var tr = h("tr", {},
        h("td", { class: "td-pos", style: "box-shadow: inset 3px 0 0 " + color, text: String(i + 1) }),
        h("td", { class: "td-team" }, h("div", { class: "team-cell" }, logo, h("span", { text: r.name }))));
      COLS.forEach(function (c, j) {
        tr.appendChild(h("td", { class: (c.wide ? "col-wide " : "") + (c.strong ? "strong" : ""), text: r.cells[j] }));
      });
      tbody.appendChild(tr);
    });

    var table = h("table", { class: "stand-table" }, h("thead", {}, head), tbody);
    var wrap = h("div", { class: "table-wrap" }, table);

    var legend = Object.keys(notes);
    var out = h("div", {}, wrap);
    if (legend.length) {
      var lg = h("ul", { class: "legend" });
      legend.forEach(function (txt) {
        var col = notes[txt] ? (/^#/.test(notes[txt]) ? notes[txt] : "#" + notes[txt]) : "#64748b";
        lg.appendChild(h("li", {}, h("i", { style: "background:" + col }), txt));
      });
      out.appendChild(lg);
    }
    return out;
  }

  function renderStandings() {
    var box = $("standings");
    box.textContent = "";
    compsForTab().forEach(function (c) {
      var t = state.tables[c.id] || { loading: true };
      var det = h("details", { class: "stand-card", "data-comp": c.id });
      if (!state.closed[c.id]) det.setAttribute("open", "");
      det.addEventListener("toggle", function () { state.closed[c.id] = !det.open; });

      det.appendChild(h("summary", { class: "stand-sum" },
        flagImg(c),
        h("span", { class: "stand-name", style: "color:" + c.color, text: c.label }),
        h("span", { class: "stand-chev" }, icon("chevron-down", "icon icon-lg"))));

      var body = h("div", { class: "stand-body" });
      if (t.none) {
        body.appendChild(h("p", { class: "stand-msg", text: c.noTable || "Sin tabla de posiciones." }));
      } else if (t.loading) {
        for (var i = 0; i < 4; i++) body.appendChild(h("div", { class: "skeleton-row" }));
      } else if (t.error) {
        body.appendChild(h("p", { class: "stand-msg", text: "No se pudo cargar la tabla (" + t.error + "). Se reintenta al recargar." }));
      } else if (!t.groups.length) {
        body.appendChild(h("p", { class: "stand-msg", text: "Sin tabla disponible por ahora (puede ser una fase de eliminación directa)." }));
      } else {
        t.groups.forEach(function (g) {
          if (g.name && (t.groups.length > 1 || !/^(standings|table)$/i.test(g.name))) {
            body.appendChild(h("h4", { class: "group-name", text: g.name.replace(/^Group /i, "Grupo ") }));
          }
          body.appendChild(standingsTable(g));
        });
      }
      det.appendChild(body);
      box.appendChild(det);
    });
    refreshIcons();
  }

  // ---------------------------------------------------------------------------
  // Interacción
  // ---------------------------------------------------------------------------
  function paintChips() {
    document.querySelectorAll("[data-status]").forEach(function (c) {
      c.className = "chip" + (c.dataset.status === state.statusFilter ? " is-on" : "");
    });
  }

  function setTab(t) {
    state.tab = t;
    state.statusFilter = "all";
    paintChips();
    try { history.replaceState(null, "", "#" + encodeURIComponent(t.toLowerCase())); } catch (e) { /* file:// */ }
    renderDays();
    load(true);
    loadTables();
  }

  function tickClock() {
    var el = $("clock");
    if (el) el.textContent = dayLabel(todayKey()) + " · " + fmtTime.format(new Date()) + " ARG";
  }

  function init() {
    var hash = decodeURIComponent(location.hash.slice(1)).toLowerCase();
    var found = TABS.filter(function (t) { return t.toLowerCase() === hash; })[0];
    if (found) state.tab = found;

    document.querySelectorAll("[data-status]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        state.statusFilter = chip.dataset.status;
        paintChips();
        render();
        replay($("content"));
      });
    });
    paintChips();

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { tickClock(); load(false); loadTables(); }
    });

    tickClock();
    setInterval(tickClock, 30000);
    renderFilters();
    renderDays();
    load(true);
    loadTables();
    refreshIcons();
  }

  init();
})();

  </script>
</body>
</html>
