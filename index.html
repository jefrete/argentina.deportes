<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1128">
  <title>Deportes Hoy - Horario Argentina</title>
  <meta name="description" content="Todos los partidos y resultados del día con horario de Argentina: fútbol argentino, copas, Europa, NBA y Los Pumas.">
 
  <link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
  <style>
/* Tema oscuro azul noche con celeste y dorado (colores de la bandera), pensado para que no sea apagado */
:root {
  color-scheme: dark;
  --bg: #0a1128;
  --bg-glow: #1b3a7a;
  --card: #131e42;
  --card-2: #1a2756;
  --border: #26377a;
  --text: #eef3ff;
  --muted: #93a5d6;
  --celeste: #75aadb;
  --gold: #f6b40e;
  --live: #ff5d73;
  --good: #4ade80;
  --radius: 14px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background:
    radial-gradient(900px 420px at 50% -80px, color-mix(in srgb, var(--bg-glow) 70%, transparent), transparent),
    var(--bg);
  background-attachment: fixed;
  -webkit-text-size-adjust: 100%;
}

img { max-width: 100%; }

/* ---------- Header ---------- */
.header { background: linear-gradient(180deg, #16296a 0%, #0f1c4d 100%); }
.header__stripe {
  height: 5px;
  background: linear-gradient(90deg, var(--celeste) 0 33.3%, #fff 33.3% 66.6%, var(--celeste) 66.6% 100%);
}
.header__inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand__logo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #fff;
  padding: 5px 12px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
}
.brand__img { height: 24px; width: auto; object-fit: contain; }
.clock { font-size: 12.5px; font-weight: 600; color: var(--celeste); text-align: right; white-space: nowrap; }

/* ---------- Filtros con banderita ---------- */
.filters {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 13px 7px 9px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .15s, background .15s, border-color .15s;
}
.filter:hover { border-color: var(--celeste); transform: translateY(-1px); }
.filter img { width: 22px; height: 15px; object-fit: cover; border-radius: 3px; }
.filter__all { font-size: 14px; line-height: 1; }
.filter.is-active {
  background: linear-gradient(135deg, var(--celeste), #a9ccee);
  border-color: transparent;
  color: #0a1128;
  box-shadow: 0 6px 16px rgba(117, 170, 219, .35);
}

/* ---------- Layout ---------- */
.container { max-width: 860px; margin: 0 auto; padding: 18px 14px 56px; }

/* ---------- Selector de día ---------- */
.days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.days[hidden] { display: none; }
.day {
  flex: 0 0 auto;
  min-width: 78px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  text-align: center;
  line-height: 1.2;
  cursor: pointer;
}
.day small { display: block; font-size: 11px; color: var(--muted); }
.day strong { font-size: 13px; }
.day.is-active { background: var(--gold); border-color: var(--gold); color: #1c1500; }
.day.is-active small { color: rgba(28, 21, 0, .7); }

/* ---------- Stats / chips ---------- */
.stats { display: flex; justify-content: center; gap: 24px; text-align: center; margin: 4px 0 16px; }
.stat strong { display: block; font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 30px; line-height: 1.05; }
.stat span { font-size: 12px; color: var(--muted); }
.stat--live strong { color: var(--live); }
.stat--done strong { color: var(--muted); }

.chips { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.chip {
  padding: 5px 13px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.chip.is-active { background: var(--card-2); border-color: var(--celeste); color: var(--text); }

/* ---------- Aviso ---------- */
.warning {
  background: rgba(246, 180, 14, .12);
  border: 1px solid rgba(246, 180, 14, .5);
  color: #fcd34d;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.5px;
  margin-bottom: 14px;
}
.warning[hidden] { display: none; }

/* ---------- Grupos y partidos ---------- */
.group { margin-bottom: 22px; }
.group__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 9px;
  font-family: "Barlow Condensed", system-ui, sans-serif;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--c, var(--celeste));
}
.group__count { font-size: 13px; font-weight: 600; color: var(--muted); }
.flag { width: 22px; height: 15px; object-fit: cover; border-radius: 3px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .18); }
.group__note {
  margin: 0 0 8px;
  padding: 9px 12px;
  font-size: 13px;
  color: var(--muted);
  background: rgba(19, 30, 66, .6);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

.event {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 10px;
  align-items: center;
  padding: 11px 12px;
  margin-bottom: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color .2s, transform .2s;
}
.event:hover { border-color: var(--celeste); }
.event.is-live {
  border-color: var(--live);
  background: linear-gradient(90deg, rgba(255, 93, 115, .14), var(--card) 60%);
  box-shadow: 0 0 0 1px rgba(255, 93, 115, .25), 0 8px 24px rgba(255, 93, 115, .12);
}

.event__when { text-align: center; line-height: 1.1; }
.event__time { font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 21px; font-weight: 700; }
.event__date { display: block; margin-top: 3px; font-size: 11px; font-weight: 600; color: var(--gold); }
.event.is-live .event__time { color: var(--live); }

.event__match { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; min-width: 0; }
.team { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 600; }
.team--away { justify-content: flex-end; text-align: right; }
.team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team img { width: 26px; height: 26px; object-fit: contain; flex: 0 0 auto; }
.team.is-winner span { font-weight: 800; color: #fff; }

.score { min-width: 80px; text-align: center; }
.score__nums { font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .03em; }
.event.is-live .score__nums { color: var(--live); }
.score__vs { font-size: 12px; color: var(--muted); }
.score__detail { display: block; margin-top: 1px; font-size: 11px; color: var(--muted); }
.event.is-live .score__detail { color: var(--live); font-weight: 700; }
.event__venue { grid-column: 2; margin-top: -4px; font-size: 11px; color: var(--muted); }

/* ---------- Resultados anteriores ---------- */
.results { margin-top: 34px; }
.results[hidden] { display: none; }
.results__block {
  margin-bottom: 14px;
  padding: 4px 12px 8px;
  background: rgba(19, 30, 66, .55);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.results__block summary { padding: 10px 0; cursor: pointer; font-size: 15px; list-style-position: inside; }
.results__block summary strong { color: var(--gold); font-family: "Barlow Condensed", system-ui, sans-serif; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.results__sub { color: var(--muted); font-size: 12.5px; }
.results__block[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 12px; }

/* ---------- Estados ---------- */
.empty { text-align: center; padding: 48px 12px; color: var(--muted); }
.empty strong { display: block; margin-bottom: 4px; color: var(--text); }

.skeleton {
  height: 64px;
  margin-bottom: 8px;
  border-radius: var(--radius);
  background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .filter, .event { transition: none; } }

.footer { margin-top: 30px; text-align: center; font-size: 11.5px; color: var(--muted); }
.footer p { margin: 4px 0; }
.diag { margin-top: 10px; text-align: left; }
.diag summary { cursor: pointer; text-align: center; }
.diag ul { margin: 8px 0 0; padding-left: 18px; }
.diag li.bad { color: #fca5a5; }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

@media (min-width: 1024px) {
  .brand__img { height: 34px; }
  .clock { font-size: 14px; }
}
@media (max-width: 480px) {
  .event { grid-template-columns: 50px 1fr; padding: 10px; }
  .team { font-size: 13px; }
  .team img { width: 22px; height: 22px; }
  .score { min-width: 66px; }
  .score__nums { font-size: 23px; }
}

</style>
</head>
